<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Grid Tactical Defense</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131a;color:#e5e7eb;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}button{border:1px solid #475569;background:#1e293b;color:white;border-radius:10px;padding:10px;cursor:pointer;font-weight:700}button:disabled{opacity:.35}#app{width:min(100vw,560px);min-height:100vh;background:#202631;position:relative;overflow:hidden}#loading{position:absolute;inset:0;background:radial-gradient(circle,#263b55,#090d14);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}#loading h1{font-size:25px;letter-spacing:2px}#bar{width:100%;height:12px;background:#111827;border-radius:20px;overflow:hidden;border:1px solid #475569}#progress{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#22c55e);transition:width .25s}.hidden{display:none!important}.hud{padding:10px;display:flex;justify-content:space-between;gap:6px;background:#111827;position:relative;z-index:2;font-size:12px}.pill{background:#0b1220;border:1px solid #334155;border-radius:9px;padding:7px}.toolbar{display:flex;gap:6px;padding:8px;flex-wrap:wrap}.toolbar button.active{border-color:#38bdf8;background:#164e63}.layout{display:grid;grid-template-columns:1fr 150px;gap:8px;padding:8px}.world{position:relative;min-width:0}canvas{width:100%;aspect-ratio:16/25;background:#17202a;border:1px solid #475569;border-radius:10px;touch-action:manipulation}.panel{background:#111827;border:1px solid #334155;border-radius:10px;padding:9px;font-size:12px}.panel h3{margin:0 0 7px;color:#7dd3fc;font-size:13px}.stat{display:flex;justify-content:space-between;margin:5px 0}.small{font-size:11px;color:#94a3b8}.upgrade{width:100%;margin-top:6px;text-align:left}.modal{position:absolute;inset:0;background:#05070dcc;z-index:10;padding:20px;display:flex;align-items:center;justify-content:center}.modalbox{background:#182231;border:1px solid #475569;border-radius:16px;padding:20px;width:100%;max-width:390px}.mapname{color:#fbbf24;font-weight:800}.footer{padding:8px;text-align:center;color:#64748b;font-size:10px}
@media(max-width:430px){.layout{grid-template-columns:1fr 125px}.panel{padding:7px;font-size:11px}.toolbar button{padding:8px;font-size:11px}}
</style></head><body><main id="app">
<section id="loading"><div class="small">POWER NETWORK SYSTEM</div><h1>GRID TACTICAL DEFENSE</h1><p id="loadText">กำลังเตรียมระบบ...</p><div id="bar"><div id="progress"></div></div><p class="small">ระบบจะบันทึกความคืบหน้าอัตโนมัติ</p><button id="start" disabled>กำลังโหลด...</button></section>
<header class="hud"><span class="pill">💰 <b id="coins">250</b></span><span class="pill">🏰 Base <b id="baseLv">1</b></span><span class="pill">📅 Day <b id="day">1</b></span><span class="pill">❤️ <b id="core">100</b></span></header>
<div class="toolbar"><button data-build="archer">🏹 ธนู $80</button><button data-build="miner">⛏️ ผลิตเงิน $60</button><button data-build="power">⚡ ส่งไฟ $40</button><button data-build="ballista">🎯 บัลลิสตา $140</button><button id="pause">หยุด</button><button id="save">บันทึก</button></div>
<div class="layout"><section class="world"><canvas id="game" width="320" height="500"></canvas><div class="footer">แตะช่องว่างเพื่อสร้างป้อม • แตะป้อมเพื่อดูอัปเกรด</div></section><aside class="panel"><h3>ฐานบัญชาการ</h3><div class="stat"><span>แผนที่</span><b class="mapname" id="mapName">Green Valley</b></div><div class="stat"><span>เลเวลฐาน</span><b id="baseLevel">1</b></div><div class="stat"><span>HP</span><b id="baseHp">100/100</b></div><button class="upgrade" id="baseUpgrade">อัปเกรดฐาน $200</button><hr><h3>สิ่งปลูกสร้าง</h3><div id="selected">ยังไม่ได้เลือก</div><button class="upgrade" id="towerUpgrade" disabled>เลือกป้อมก่อน</button><button class="upgrade" id="newGame">เริ่มเกมใหม่</button></aside></div>
<div id="modal" class="modal hidden"><div class="modalbox"><h2 id="modalTitle">เกมจบ</h2><p id="modalText"></p><button id="modalBtn">เริ่มใหม่</button></div></div>
<script>
const $=id=>document.getElementById(id),ctx=$('game').getContext('2d'),W=16,H=25,S=20,KEY='gtd_save_v3';
const maps=[{name:'Green Valley',bg:'#20382c',ground:'#294936',accent:'#65a30d'},{name:'Desert Outpost',bg:'#59452b',ground:'#80613a',accent:'#f59e0b'},{name:'Frozen Ridge',bg:'#263e52',ground:'#42647b',accent:'#7dd3fc'},{name:'Dark Wasteland',bg:'#30283e',ground:'#51405e',accent:'#c084fc'},{name:'Power Ruins',bg:'#263a3a',ground:'#345454',accent:'#22d3ee'}];
const defs={archer:{name:'Archer',cost:80,hp:70,range:4,damage:8,rate:45,color:'#38bdf8'},miner:{name:'Miner',cost:60,hp:55,rate:180,income:7,color:'#facc15'},power:{name:'Transmitter',cost:40,hp:45,power:4.5,color:'#22c55e'},ballista:{name:'Ballista',cost:140,hp:110,range:6,damage:28,rate:90,color:'#fb923c'}};
let state={coins:250,day:1,baseLevel:1,core:100,paused:false,gameOver:false,selectedBuild:'archer',selected:null,spawn:0,map:0};let grid=[],enemies=[],shots=[],last=0;
function save(){localStorage.setItem(KEY,JSON.stringify({state,grid:grid.map(row=>row.map(c=>c.building?{id:c.building.id,level:c.building.level,hp:c.building.hp}:null))}));}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(!d)return false;Object.assign(state,d.state);makeGrid();d.grid.forEach((row,r)=>row.forEach((b,c)=>{if(b&&b.id!=='core'&&defs[b.id])grid[r][c].building={...defs[b.id],id:b.id,level:b.level||1,hp:b.hp,maxHp:defs[b.id].hp*(b.level||1)}}));return true}catch(e){return false}}
function makeGrid(){grid=Array.from({length:H},(_,r)=>Array.from({length:W},(_,c)=>({type:0,building:null})));for(let r=0;r<H;r++)for(let c=0;c<W;c++){if(c===0||c===W-1||((r+state.map)%6===0&&c%4===0))grid[r][c].type=1;if((r+c+state.map)%13===0)grid[r][c].type=2}grid[H-3][8].building={id:'core',hp:state.core,maxHp:100,level:state.baseLevel};}
function cost(base,lv){return Math.floor(base*Math.pow(1.65,lv-1))}function map(){return maps[state.map%5]}
function powerAt(r,c){if(Math.hypot(r-(H-3),c-8)<=3+state.baseLevel*.3)return true;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let b=grid[y][x].building;if(b&&b.id==='power'&&Math.hypot(r-y,c-x)<=b.power+state.baseLevel*.2)return true}return false}
function canBuild(r,c){return r>=0&&c>=0&&r<H&&c<W&&grid[r][c].type===0&&!grid[r][c].building&&!(r>H-7&&c>5&&c<11)}
function place(r,c,id){let d=defs[id];if(!canBuild(r,c)||state.coins<d.cost)return;state.coins-=d.cost;grid[r][c].building={...d,id,level:1,maxHp:d.hp,hp:d.hp,timer:0};save();update()}
function upgradeBase(){let price=cost(200,state.baseLevel);if(state.coins<price)return;state.coins-=price;state.baseLevel++;state.core=100+state.baseLevel*25;save();update()}
function upgradeTower(){let b=state.selected;if(!b||b.id==='core')return;let price=cost(defs[b.id].cost*2,b.level);if(state.baseLevel<b.level+1||state.coins<price)return;state.coins-=price;b.level++;b.maxHp=defs[b.id].hp*b.level;b.hp=b.maxHp;b.damage=(defs[b.id].damage||0)*b.level;b.range=(defs[b.id].range||0)+b.level*.2;save();update()}
function spawn(){let c=1+Math.floor(Math.random()*(W-2));enemies.push({x:(c+.5)*S,y:.5*S,hp:20+state.day*8,max:20+state.day*8,speed:.35+state.day*.01})}
function tick(dt){if(state.paused||state.gameOver)return;state.spawn+=dt;if(state.spawn>Math.max(25,100-state.day*3)){state.spawn=0;spawn()}for(let e of enemies){let tx=8.5*S,ty=(H-3.5)*S,dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);let r=Math.floor(e.y/S),c=Math.floor(e.x/S);if(d<10){state.core-=.08*dt;if(state.core<=0)endGame('CORE DESTROYED','ฐานถูกทำลาย');}else{e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}}for(let r=0;r<H;r++)for(let c=0;c<W;c++){let b=grid[r][c].building;if(!b||b.id==='core')continue;b.timer=(b.timer||0)+dt;if(b.id==='miner'&&b.timer>180){state.coins+=b.income*b.level;b.timer=0}if((b.id==='archer'||b.id==='ballista')&&b.timer>(b.rate||60)){let target=enemies.find(e=>Math.hypot(e.x-(c+.5)*S,e.y-(r+.5)*S)<b.range*S&&powerAt(r,c));if(target){shots.push({x:(c+.5)*S,y:(r+.5)*S,target,damage:b.damage*b.level||b.damage,color:b.color});b.timer=0}}}for(let s of shots){if(!enemies.includes(s.target))continue;s.target.hp-=s.damage*dt/10;if(s.target.hp<=0){state.coins+=10+Math.floor(state.day/2);enemies=enemies.filter(e=>e!==s.target)}}shots=shots.filter(s=>enemies.includes(s.target));if(Math.random()<.002*dt){state.day++;state.map=(state.day-1)%5;makeGrid();save()}update()}
function draw(){let m=map();ctx.fillStyle=m.bg;ctx.fillRect(0,0,320,500);for(let r=0;r<H;r++)for(let c=0;c<W;c++){let x=c*S,y=r*S;ctx.fillStyle=grid[r][c].type===1?'#111827':grid[r][c].type===2?'#1e4b5a':m.ground;ctx.fillRect(x,y,S-1,S-1);if(grid[r][c].type===0){ctx.fillStyle=m.accent;ctx.globalAlpha=.15;ctx.fillRect(x+8,y+8,3,3);ctx.globalAlpha=1}let b=grid[r][c].building;if(b){ctx.fillStyle=b.id==='core'?'#fbbf24':b.color;ctx.fillRect(x+3,y+3,S-7,S-7);ctx.fillStyle='#07111c';ctx.font='11px sans-serif';ctx.fillText(b.id==='core'?'☀':b.id==='archer'?'🏹':b.id==='miner'?'$':b.id==='power'?'⚡':'🎯',x+4,y+14);ctx.fillStyle='#111827';ctx.fillRect(x+2,y+1,S-5,3);ctx.fillStyle='#22c55e';ctx.fillRect(x+2,y+1,(S-5)*Math.max(0,b.hp/b.maxHp),3);if(b===state.selected){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,S-3,S-3)}}}for(let e of enemies){ctx.fillStyle='#e11d48';ctx.beginPath();ctx.moveTo(e.x,e.y-6);ctx.lineTo(e.x+6,e.y);ctx.lineTo(e.x,e.y+6);ctx.lineTo(e.x-6,e.y);ctx.closePath();ctx.fill();ctx.fillStyle='#22c55e';ctx.fillRect(e.x-6,e.y-10,12*Math.max(0,e.hp/e.max),2)}for(let s of shots){ctx.strokeStyle=s.color;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.target.x,s.target.y);ctx.stroke()}}
function update(){ $('coins').textContent=Math.floor(state.coins);$('baseLv').textContent=state.baseLevel;$('baseLevel').textContent=state.baseLevel;$('day').textContent=state.day;$('core').textContent=Math.max(0,Math.floor(state.core));$('baseHp').textContent=Math.floor(state.core)+'/'+(100+state.baseLevel*25);$('mapName').textContent=map().name;$('baseUpgrade').textContent='อัปเกรดฐาน $'+cost(200,state.baseLevel);let b=state.selected;if(b){$('selected').innerHTML='<b>'+b.name+'</b><br>เลเวล '+b.level+'<br>HP '+Math.floor(b.hp)+'/'+b.maxHp;$('towerUpgrade').disabled=state.baseLevel<b.level+1||state.coins<cost(defs[b.id].cost*2,b.level);$('towerUpgrade').textContent=state.baseLevel<b.level+1?'ต้องอัปฐานเป็น '+(b.level+1):'อัปเกรดป้อม $'+cost(defs[b.id].cost*2,b.level)}else{$('selected').textContent='ยังไม่ได้เลือก';$('towerUpgrade').disabled=true;$('towerUpgrade').textContent='เลือกป้อมก่อน'}draw()}
function resetToStart(){localStorage.removeItem(KEY);state={coins:250,day:1,baseLevel:1,core:100,paused:false,gameOver:false,selectedBuild:'archer',selected:null,spawn:0,map:0};enemies=[];shots=[];makeGrid();$('modal').classList.add('hidden');$('pause').textContent='หยุด';update()}
function endGame(t,d){state.gameOver=true;state.paused=false;save();$('modalTitle').textContent=t;$('modalText').textContent=d+'\nความคืบหน้าของรอบนี้จะถูกรีเซ็ตเมื่อเริ่มใหม่';$('modal').classList.remove('hidden')}
$('baseUpgrade').onclick=upgradeBase;$('towerUpgrade').onclick=upgradeTower;$('save').onclick=save;$('pause').onclick=()=>{state.paused=!state.paused;$('pause').textContent=state.paused?'เล่นต่อ':'หยุด';};$('newGame').onclick=()=>{if(confirm('ลบความคืบหน้าและเริ่มใหม่?')){localStorage.removeItem(KEY);location.reload()}};$('modalBtn').onclick=()=>resetToStart();document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{state.selectedBuild=b.dataset.build;document.querySelectorAll('[data-build]').forEach(x=>x.classList.toggle('active',x===b))});$('game').onclick=e=>{let rect=$('game').getBoundingClientRect(),c=Math.floor((e.clientX-rect.left)/rect.width*W),r=Math.floor((e.clientY-rect.top)/rect.height*H),b=grid[r]?.[c]?.building;if(b){state.selected=b;update()}else place(r,c,state.selectedBuild)};
function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;tick(dt);requestAnimationFrame(loop)}
let p=0;let loader=setInterval(()=>{p+=10;$('progress').style.width=p+'%';$('loadText').textContent=['เตรียมแผนที่ 5 แห่ง...','โหลดระบบอัปเกรด...','เชื่อมต่อ Power Network...','เตรียมศัตรู...','พร้อมรบ!'][Math.min(4,Math.floor(p/25))];if(p>=100){clearInterval(loader);$('start').disabled=false;$('start').textContent='เริ่มเกม';$('start').onclick=()=>{$('loading').classList.add('hidden');if(!load()){makeGrid()}update();requestAnimationFrame(loop)}}},120);
</script></main></body></html>
